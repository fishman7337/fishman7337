nt-weight="400" letter-spacing="0" text-anchor="start">02</text><text x="90" y="201" fill="#B8ADFF" font-size="29" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="700" letter-spacing="0.2" text-anchor="start">DATA</text><text x="90" y="230" fill="#A5B4BF" font-size="19" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Understand the evidence</text><circle cx="43" cy="189" r="4" fill="#B8ADFF"/><path d="M43 197L43 286" fill="none" stroke="#2A3C4C" stroke-width="1" opacity="1"/><text x="90" y="275" fill="#FFA58A" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="400" letter-spacing="0" text-anchor="start">03</text><text x="90" y="306" fill="#FFA58A" font-size="29" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="700" letter-spacing="0.2" text-anchor="start">MODELS</text><text x="90" y="335" fill="#A5B4BF" font-size="19" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Experiment &amp; evaluate</text><circle cx="43" cy="294" r="4" fill="#FFA58A"/><path d="M43 302L43 391" fill="none" stroke="#2A3C4C" stroke-width="1" opacity="1"/><text x="90" y="380" fill="#F4F0E8" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="400" letter-spacing="0" text-anchor="start">04</text><text x="90" y="411" fill="#F4F0E8" font-size="29" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="700" letter-spacing="0.2" text-anchor="start">PRODUCT</text><text x="90" y="440" fill="#A5B4BF" font-size="19" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Build for people</text><circle cx="43" cy="399" r="4" fill="#F4F0E8"/><path d="M34 479L566 479" fill="none" stroke="#2A3C4C" stroke-width="1" opacity="1"/><circle cx="42" cy="511" r="3" fill="#64E2CB"/><text x="58" y="518" fill="#F4F0E8" font-size="22" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="4