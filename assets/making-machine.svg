<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">From question to useful</title><desc id="desc">An animated path moves through question, data, baseline, experiment, product, and sharing.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080B12"/>
    <stop offset=".58" stop-color="#141522"/>
    <stop offset="1" stop-color="#211A25"/>
  </linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#63D9D1"/>
    <stop offset=".5" stop-color="#B89DFF"/>
    <stop offset="1" stop-color="#FF9B7A"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#F3EBDD" stroke-opacity=".045"/>
  </pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02040A" flood-opacity=".58"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style><![CDATA[
    .display{font:800 58px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-2px}
    .mobileDisplay{font:800 64px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-2px}
    .title{font:800 40px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-1px}
    .section{font:780 28px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-.45px}
    .body{font:520 18px Inter,Segoe UI,Arial,sans-serif;fill:#B9B3AC}
    .mobileBody{font:520 25px Inter,Segoe UI,Arial,sans-serif;fill:#B9B3AC}
    .small{font:570 15px Inter,Segoe UI,Arial,sans-serif;fill:#B9B3AC}
    .mono{font:720 13px 'JetBrains Mono',Consolas,monospace;fill:#F3EBDD;letter-spacing:1.5px}
    .wire{fill:none;stroke:url(#signal);stroke-width:2;stroke-linecap:round}
    .dash{stroke-dasharray:8 13;animation:dash 13s linear infinite}
    .floatA{animation:floatA 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .floatB{animation:floatB 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes dash{to{stroke-dashoffset:-420}}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>
</defs><rect width="1200" height="430" rx="28" fill="url(#night)"/><rect width="1200" height="430" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#F3EBDD" stroke-opacity=".14"/><text x="54" y="57" class="mono">FROM QUESTION TO USEFUL / 06 STAGES</text><text x="54" y="110" class="title">The model is only the middle.</text><text x="55" y="145" class="body">Good work also explains where it came from and how someone else can try it.</text><path id="route" d="M92 280C226 193 340 350 474 262S704 183 838 270S1008 334 1110 245" fill="none" stroke="#F3EBDD" stroke-opacity=".16" stroke-width="34" stroke-linecap="round"/><path d="M92 280C226 193 340 350 474 262S704 183 838 270S1008 334 1110 245" class="wire dash" stroke-width="3"/><g class="floatA"><circle cx="92" cy="280" r="33" fill="#171923" stroke="#63D9D1" stroke-opacity=".75" filter="url(#soft)"/><circle cx="92" cy="280" r="10" fill="#63D9D1" class="pulse"/><text x="92" y="341" text-anchor="middle" class="mono">01</text><text x="92" y="365" text-anchor="middle" class="small">Question</text></g><g class="floatB"><circle cx="290" cy="252" r="33" fill="#171923" stroke="#75A9FF" stroke-opacity=".75" filter="url(#soft)"/><circle cx="290" cy="252" r="10" fill="#75A9FF" class="pulse"/><text x="290" y="313" text-anchor="middle" class="mono">02</text><text x="290" y="337" text-anchor="middle" class="small">Data</text></g><g class="floatA"><circle cx="474" cy="262" r="33" fill="#171923" stroke="#B89DFF" stroke-opacity=".75" filter="url(#soft)"/><circle cx="474" cy="262" r="10" fill="#B89DFF" class="pulse"/><text x="474" y="323" text-anchor="middle" class="mono">03</text><text x="474" y="347" text-anchor="middle" class="small">Baseline</text></g><g class="floatB"><circle cx="672" cy="229" r="33" fill="#171923" stroke="#FF9B7A" stroke-opacity=".75" filter="url(#soft)"/><circle cx="672" cy="229" r="10" fill="#FF9B7A" class="pulse"/><text x="672" y="290" text-anchor="middle" class="mono">04</text><text x="672" y="314" text-anchor="middle" class="small">Experiment</text></g><g class="floatA"><circle cx="838" cy="270" r="33" fill="#171923" stroke="#F2C76E" stroke-opacity=".75" filter="url(#soft)"/><circle cx="838" cy="270" r="10" fill="#F2C76E" class="pulse"/><text x="838" y="331" text-anchor="middle" class="mono">05</text><text x="838" y="355" text-anchor="middle" class="small">Product</text></g><g class="floatB"><circle cx="1110" cy="245" r="33" fill="#171923" stroke="#8FBE72" stroke-opacity=".75" filter="url(#soft)"/><circle cx="1110" cy="245" r="10" fill="#8FBE72" class="pulse"/><text x="1110" y="306" text-anchor="middle" class="mono">06</text><text x="1110" y="330" text-anchor="middle" class="small">Share</text></g><circle r="9" fill="#FFF9EF" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle><text x="54" y="402" class="mono">QUESTION · EVIDENCE · ARTIFACT · HANDOFF</text></svg>