<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Goh Kun Ming&#x27;s working manifesto</title><desc id="desc">An editorial introduction about turning questions into evidence, experiments, and useful software.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040714"/><stop offset="0.55" stop-color="#10132A"/><stop offset="1" stop-color="#16112C"/></linearGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38D9F5"/><stop offset="0.52" stop-color="#A78BFA"/><stop offset="1" stop-color="#FB8B7B"/></linearGradient><radialGradient id="orb" cx="35%" cy="28%" r="72%"><stop offset="0" stop-color="#F7FAFF" stop-opacity=".96"/><stop offset=".18" stop-color="#38D9F5" stop-opacity=".84"/><stop offset=".62" stop-color="#A78BFA" stop-opacity=".56"/><stop offset="1" stop-color="#11152A" stop-opacity=".3"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8DA2C7" stroke-opacity=".08"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040B" flood-opacity=".58"/></filter><style><![CDATA[.title{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-1.8px}.display{font:800 42px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-1.4px}.section{font:800 30px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-.6px}.cardTitle{font:750 20px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF}.body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.small{font:550 13px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.mono{font:700 13px 'JetBrains Mono',Consolas,monospace;fill:#C8F8FF;letter-spacing:1.2px}.glass{fill:#12182C;fill-opacity:.78;stroke:#A8B4D1;stroke-opacity:.17}.glassBright{fill:#17213A;fill-opacity:.86;stroke:#38D9F5;stroke-opacity:.34}.mesh{fill:none;stroke:url(#signal);stroke-width:1.5;stroke-opacity:.46}.dash{stroke-dasharray:8 13;animation:dash 14s linear infinite}.driftA{animation:driftA 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.driftB{animation:driftB 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-420}}@keyframes driftA{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes driftB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pulse{0%,100%{opacity:.58;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style></defs><rect width="1200" height="430" rx="28" fill="url(#bg)"/><rect width="1200" height="430" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#99A9C8" stroke-opacity=".16"/><rect x="48" y="46" width="675" height="338" rx="30" class="glassBright" filter="url(#soft)"/><text x="82" y="92" class="mono">THE MESSY MIDDLE</text><text x="80" y="153" class="display">I like the moment</text><text x="80" y="202" class="display">when a question</text><text x="80" y="251" class="display">becomes a tool.</text><text x="82" y="302" class="body">Data first. Baseline nearby. Claims kept honest.</text><text x="82" y="330" class="body">Then make the useful part approachable.</text><path d="M82 357 H638" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" class="dash"/><g class="driftA"><rect x="755" y="46" width="397" height="96" rx="24" class="glass"/><rect x="755" y="46" width="6" height="96" rx="3" fill="#38D9F5" opacity=".86"/><circle cx="790" cy="74" r="7" fill="#38D9F5" filter="url(#glow)"/><text x="811" y="79" class="mono">NOW</text><text x="788" y="108" class="cardTitle">Applied AI &amp; Analytics</text><text x="788" y="129" class="small">Learning in Singapore</text></g><g class="driftB"><rect x="755" y="162" width="397" height="96" rx="24" class="glass"/><rect x="755" y="162" width="6" height="96" rx="3" fill="#A78BFA" opacity=".86"/><circle cx="790" cy="190" r="7" fill="#A78BFA" filter="url(#glow)"/><text x="811" y="195" class="mono">CURIOUS ABOUT</text><text x="788" y="224" class="cardTitle">Generative AI · Vision</text><text x="788" y="245" class="small">Quantum ML · Data products</text></g><g class="driftA"><rect x="755" y="278" width="397" height="96" rx="24" class="glass"/><rect x="755" y="278" width="6" height="96" rx="3" fill="#FB8B7B" opacity=".86"/><circle cx="790" cy="306" r="7" fill="#FB8B7B" filter="url(#glow)"/><text x="811" y="311" class="mono">DEFAULT MODE</text><text x="788" y="340" class="cardTitle">Build → test → explain</text><text x="788" y="361" class="small">Share the evidence trail</text></g></svg>
