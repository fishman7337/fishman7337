<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Current curiosities</title><desc id="desc">Three animated objects represent generative systems, computer vision, and human-friendly machine learning.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080B12"/>
    <stop offset=".58" stop-color="#141522"/>
    <stop offset="1" stop-color="#211A25"/>
  </linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#63D9D1"/>
    <stop offset=".5" stop-color="#B89DFF"/>
    <stop offset="1" stop-color="#FF9B7A"/>
  </linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F2C76E"/>
    <stop offset=".5" stop-color="#D99362"/>
    <stop offset="1" stop-color="#FF9B7A"/>
  </linearGradient>
  <radialGradient id="globe" cx="35%" cy="28%" r="75%">
    <stop offset="0" stop-color="#F3EBDD"/>
    <stop offset=".18" stop-color="#63D9D1" stop-opacity=".95"/>
    <stop offset=".62" stop-color="#B89DFF" stop-opacity=".58"/>
    <stop offset="1" stop-color="#131523" stop-opacity=".2"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#F3EBDD" stroke-opacity=".045"/>
  </pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02040A" flood-opacity=".58"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style><![CDATA[
    .display{font:800 55px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-2px}
    .title{font:800 38px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-1px}
    .section{font:780 27px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF;letter-spacing:-.45px}
    .cardTitle{font:760 20px Inter,Segoe UI,Arial,sans-serif;fill:#FFF9EF}
    .body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#B9B3AC}
    .small{font:560 13px Inter,Segoe UI,Arial,sans-serif;fill:#B9B3AC}
    .mono{font:700 12px 'JetBrains Mono',Consolas,monospace;fill:#F3EBDD;letter-spacing:1.5px}
    .panel{fill:#171923;fill-opacity:.9;stroke:#F3EBDD;stroke-opacity:.13}
    .wire{fill:none;stroke:url(#signal);stroke-width:2;stroke-linecap:round}
    .dash{stroke-dasharray:8 13;animation:dash 13s linear infinite}
    .floatA{animation:floatA 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .floatB{animation:floatB 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
    .scan{animation:scan 5.5s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-420}}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes scan{0%,100%{opacity:.15;transform:translateX(-35px)}50%{opacity:.72;transform:translateX(35px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>
</defs><rect width="1200" height="390" rx="28" fill="url(#night)"/><rect width="1200" height="390" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#F3EBDD" stroke-opacity=".14"/><text x="54" y="56" class="mono">CURRENT CURIOSITIES / SUBJECT TO CHANGE</text><text x="54" y="104" class="title">Three corners I keep wandering back to.</text><g transform="translate(54 137)"><rect width="342" height="202" rx="24" class="panel" filter="url(#soft)"/><circle cx="171" cy="58" r="34" fill="url(#globe)" class="pulse"/><ellipse cx="171" cy="58" rx="54" ry="18" fill="none" stroke="#D99362" class="spin"/><ellipse cx="171" cy="58" rx="18" ry="54" fill="none" stroke="#B89DFF" class="spin"/><text x="22" y="133" class="cardTitle">Generative systems</text><text x="22" y="158" class="small">Small, inspectable experiments that make</text><text x="22" y="177" class="small">model behaviour easier to reason about.</text></g><circle cx="225" cy="356" r="3" fill="#63D9D1"/><g transform="translate(428 137)"><rect width="342" height="202" rx="24" class="panel" filter="url(#soft)"/><path d="M135 77C140 27 195 18 211 38C213 80 180 96 143 82Z" fill="#8FBE72" fill-opacity=".72" stroke="#F3EBDD" stroke-opacity=".5" class="floatA"/><path d="M139 88L201 37M160 69l-18-16m39-3l9 20" fill="none" stroke="#F3EBDD" stroke-opacity=".62"/><path d="M116 27h28M116 27v28M226 27h-28M226 27v28M116 90h28M116 90V62M226 90h-28M226 90V62" fill="none" stroke="#63D9D1" stroke-width="2" class="scan"/><text x="22" y="133" class="cardTitle">Computer vision</text><text x="22" y="158" class="small">Reliable paths from messy data and</text><text x="22" y="177" class="small">validation to inference people can</text><text x="22" y="196" class="small">actually use.</text></g><circle cx="599" cy="356" r="3" fill="#8FBE72"/><g transform="translate(802 137)"><rect width="342" height="202" rx="24" class="panel" filter="url(#soft)"/><path d="M110 72C135 19 169 103 197 47S231 84 246 43" class="wire dash"/><circle cx="110" cy="72" r="6" fill="#63D9D1" class="pulse"/><circle cx="197" cy="47" r="6" fill="#B89DFF" class="pulse"/><circle cx="246" cy="43" r="6" fill="#FF9B7A" class="pulse"/><text x="22" y="133" class="cardTitle">Human-friendly ML</text><text x="22" y="158" class="small">Interfaces and explanations that help a</text><text x="22" y="177" class="small">model become a useful learning object.</text></g><circle cx="973" cy="356" r="3" fill="#FF9B7A"/></svg>