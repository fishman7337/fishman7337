<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">How Goh Kun Ming grows ideas</title><desc id="desc">Four focus cards covering exploration, modelling, product building, and sharing open work.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040714"/><stop offset="0.55" stop-color="#10132A"/><stop offset="1" stop-color="#16112C"/></linearGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38D9F5"/><stop offset="0.52" stop-color="#A78BFA"/><stop offset="1" stop-color="#FB8B7B"/></linearGradient><radialGradient id="orb" cx="35%" cy="28%" r="72%"><stop offset="0" stop-color="#F7FAFF" stop-opacity=".96"/><stop offset=".18" stop-color="#38D9F5" stop-opacity=".84"/><stop offset=".62" stop-color="#A78BFA" stop-opacity=".56"/><stop offset="1" stop-color="#11152A" stop-opacity=".3"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8DA2C7" stroke-opacity=".08"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040B" flood-opacity=".58"/></filter><style><![CDATA[.title{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-1.8px}.section{font:800 30px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-.6px}.cardTitle{font:750 20px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF}.body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.small{font:550 13px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.mono{font:700 13px 'JetBrains Mono',Consolas,monospace;fill:#C8F8FF;letter-spacing:1.2px}.glass{fill:#12182C;fill-opacity:.78;stroke:#A8B4D1;stroke-opacity:.17}.glassBright{fill:#17213A;fill-opacity:.86;stroke:#38D9F5;stroke-opacity:.34}.mesh{fill:none;stroke:url(#signal);stroke-width:1.5;stroke-opacity:.46}.dash{stroke-dasharray:8 13;animation:dash 14s linear infinite}.driftA{animation:driftA 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.driftB{animation:driftB 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-420}}@keyframes driftA{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes driftB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pulse{0%,100%{opacity:.58;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style></defs><rect width="1200" height="380" rx="28" fill="url(#bg)"/><rect width="1200" height="380" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#99A9C8" stroke-opacity=".16"/><text x="54" y="62" class="section">How I grow an idea</text><text x="54" y="91" class="body">A small loop for turning curiosity into something useful.</text><path d="M88 304 C246 242 330 352 480 290 S744 226 890 290 S1054 338 1160 260" class="mesh dash"/><g class="driftA" filter="url(#soft)"><rect x="54" y="126" width="250" height="164" rx="24" class="glass"/><circle cx="88" cy="160" r="10" fill="#38D9F5" opacity=".9" filter="url(#glow)"/><text x="110" y="166" class="mono">Questions</text><text x="78" y="207" class="cardTitle">Explore</text><text x="78" y="238" class="small">Find a worthwhile question and</text><text x="78" y="258" class="small">understand the data before</text><text x="78" y="278" class="small">choosing a model.</text></g><g class="driftB" filter="url(#soft)"><rect x="340" y="126" width="250" height="164" rx="24" class="glass"/><circle cx="374" cy="160" r="10" fill="#A78BFA" opacity=".9" filter="url(#glow)"/><text x="396" y="166" class="mono">Experiments</text><text x="364" y="207" class="cardTitle">Model</text><text x="364" y="238" class="small">Build honest baselines, test</text><text x="364" y="258" class="small">assumptions, and keep the</text><text x="364" y="278" class="small">comparison reproducible.</text></g><g class="driftA" filter="url(#soft)"><rect x="626" y="126" width="250" height="164" rx="24" class="glass"/><circle cx="660" cy="160" r="10" fill="#FB8B7B" opacity=".9" filter="url(#glow)"/><text x="682" y="166" class="mono">Products</text><text x="650" y="207" class="cardTitle">Build</text><text x="650" y="238" class="small">Turn useful ideas into</text><text x="650" y="258" class="small">approachable apps, pipelines,</text><text x="650" y="278" class="small">and documented workflows.</text></g><g class="driftB" filter="url(#soft)"><rect x="912" y="126" width="250" height="164" rx="24" class="glass"/><circle cx="946" cy="160" r="10" fill="#5EEAD4" opacity=".9" filter="url(#glow)"/><text x="968" y="166" class="mono">Open work</text><text x="936" y="207" class="cardTitle">Share</text><text x="936" y="238" class="small">Publish the reasoning,</text><text x="936" y="258" class="small">limitations, and artifacts</text><text x="936" y="278" class="small">that make the work reviewable.</text></g></svg>
