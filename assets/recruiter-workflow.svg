r people</text><path d="M44 166L1156 166" fill="none" stroke="#2A3C4C" stroke-width="1" opacity="1"/><circle cx="52" cy="198" r="3" fill="#64E2CB"/><text x="69" y="205" fill="#F4F0E8" font-size="20" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Evaluation &amp; responsible engineering</text><text x="1156" y="205" fill="#64E2CB" font-size="11" font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="400" letter-spacing="0" text-anchor="end">AT EVERY STAGE</text></svg>
