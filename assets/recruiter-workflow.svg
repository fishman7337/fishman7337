<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc"><title id="title">How I work: question, data, models, product</title><desc id="desc">Frame the decision; understand the evidence; experiment and evaluate; build for people. Evaluation and responsible engineering underpin every stage. Conceptual workflow.</desc><defs><linearGradient id="signal" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#64E2CB"/><stop offset=".55" stop-color="#B8ADFF"/><stop offset="1" stop-color="#FFA58A"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#A5B4BF" opacity=".15"/></pattern><style>.signal{animation:breathe 7s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.68}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style></defs><rect width="1200" height="240" rx="18" fill="#08111C"/><rect x=".5" y=".5" width="1199" height="239" rx="17.5" fill="none" stroke="#2A3C4C"/><text x="44" y="34" fill="#A5B4BF" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="400" letter-spacing="0.5" text-anchor="start">FROM A GOOD QUESTION TO A USEFUL SYSTEM</text><text x="44" y="73" fill="#64E2CB" font-size="12" font-family="'DejaVu Sans Mono',Consolas,monospace" font-weight="400" letter-spacing="0" text-anchor="start">01</text><text x="44" y="104" fill="#64E2CB" font-size="27" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="700" letter-spacing="0.2" text-anchor="start">QUESTION</text><text x="44" y="133" fill="#A5B4BF" font-size="18" font-family="Arial,'DejaVu Sans',sans-serif" font-weight="400" letter-spacing="0" text-anchor="start">Frame the decision</text><path d="M265 96L295 96" fill="none" stroke="#A5B4BF" stroke-width="1" opacity="1"/><polyline points="290.00,92.00 295.00,96.00 290.00,100.00" fill="none" stroke="#A5B4BF" stroke-width="1.2" stroke-linejoin="round" opacity="1"/><