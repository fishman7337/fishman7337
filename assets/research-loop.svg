<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Evidence-first research loop</title><desc id="desc">Question, baseline, experiment, evaluation, and sharing connected by an animated signal path.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040714"/><stop offset="0.55" stop-color="#10132A"/><stop offset="1" stop-color="#16112C"/></linearGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38D9F5"/><stop offset="0.52" stop-color="#A78BFA"/><stop offset="1" stop-color="#FB8B7B"/></linearGradient><radialGradient id="orb" cx="35%" cy="28%" r="72%"><stop offset="0" stop-color="#F7FAFF" stop-opacity=".96"/><stop offset=".18" stop-color="#38D9F5" stop-opacity=".84"/><stop offset=".62" stop-color="#A78BFA" stop-opacity=".56"/><stop offset="1" stop-color="#11152A" stop-opacity=".3"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8DA2C7" stroke-opacity=".08"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02040B" flood-opacity=".58"/></filter><style><![CDATA[.title{font:800 52px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-1.8px}.section{font:800 30px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF;letter-spacing:-.6px}.cardTitle{font:750 20px Inter,Segoe UI,Arial,sans-serif;fill:#F7FAFF}.body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.small{font:550 13px Inter,Segoe UI,Arial,sans-serif;fill:#A8B4D1}.mono{font:700 13px 'JetBrains Mono',Consolas,monospace;fill:#C8F8FF;letter-spacing:1.2px}.glass{fill:#12182C;fill-opacity:.78;stroke:#A8B4D1;stroke-opacity:.17}.glassBright{fill:#17213A;fill-opacity:.86;stroke:#38D9F5;stroke-opacity:.34}.mesh{fill:none;stroke:url(#signal);stroke-width:1.5;stroke-opacity:.46}.dash{stroke-dasharray:8 13;animation:dash 14s linear infinite}.driftA{animation:driftA 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.driftB{animation:driftB 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-420}}@keyframes driftA{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes driftB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes pulse{0%,100%{opacity:.58;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}]]></style></defs><rect width="1200" height="300" rx="28" fill="url(#bg)"/><rect width="1200" height="300" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#99A9C8" stroke-opacity=".16"/><text x="54" y="57" class="section">My research loop</text><text x="54" y="86" class="body">Good work should leave a trail that someone else can follow.</text><path id="flow" d="M116 190 C260 120 328 248 462 190 S676 132 804 190 S1002 238 1090 190" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".5"/><circle r="8" fill="#38D9F5" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M116 190 C260 120 328 248 462 190 S676 132 804 190 S1002 238 1090 190"/></circle><g class="driftA"><rect x="34" y="126" width="198" height="90" rx="20" class="glassBright"/><text x="52" y="153" class="mono" fill="#38D9F5">01</text><text x="52" y="180" class="cardTitle">Question</text><text x="52" y="202" class="small">Make it specific</text></g><g class="driftB"><rect x="265" y="180" width="198" height="90" rx="20" class="glassBright"/><text x="283" y="207" class="mono" fill="#A78BFA">02</text><text x="283" y="234" class="cardTitle">Baseline</text><text x="283" y="256" class="small">Start honestly</text></g><g class="driftA"><rect x="496" y="126" width="198" height="90" rx="20" class="glassBright"/><text x="514" y="153" class="mono" fill="#FB8B7B">03</text><text x="514" y="180" class="cardTitle">Experiment</text><text x="514" y="202" class="small">Keep it reproducible</text></g><g class="driftB"><rect x="727" y="180" width="198" height="90" rx="20" class="glassBright"/><text x="745" y="207" class="mono" fill="#5EEAD4">04</text><text x="745" y="234" class="cardTitle">Evaluate</text><text x="745" y="256" class="small">Measure + limit</text></g><g class="driftA"><rect x="958" y="126" width="198" height="90" rx="20" class="glassBright"/><text x="976" y="153" class="mono" fill="#38D9F5">05</text><text x="976" y="180" class="cardTitle">Share</text><text x="976" y="202" class="small">Publish the trail</text></g></svg>
