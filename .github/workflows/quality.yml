name: Quality

on:
  push:
    paths:
      - "AGENTS.md"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check scripts tests

      - name: Check formatting
        run: python -m ruff format --check scripts tests

      - name: Test asset generation
        run: python -m pytest

      - name: Verify committed SVG assets are current
        run: |
          python scripts/build_assets.py
          git diff --exit-code -- assets
