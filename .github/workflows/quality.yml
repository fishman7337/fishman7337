name: Quality

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "assets/recruiter-*.svg"
      - "assets/portfolio-*"
      - "assets/profile-hero*"
      - "assets/process-*"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "assets/recruiter-*.svg"
      - "assets/portfolio-*"
      - "assets/profile-hero*"
      - "assets/process-*"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check scripts tests

      - name: Check formatting
        run: python -m ruff format --check scripts tests

      - name: Test asset generation
        run: python -m pytest

      - name: Verify committed profile assets are current
        run: |
          python scripts/build_assets.py
          python scripts/build_3d_mesh.py
          python scripts/build_recruiter_assets.py
          python scripts/build_portfolio_animations.py
          python scripts/build_profile_motion.py
          python scripts/build_more_project_animations.py
          git diff --exit-code -- assets
