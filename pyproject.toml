[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fishman7337-profile-assets"
version = "0.1.0"
description = "Deterministic generators and previews for Goh Kun Ming's GitHub profile assets."
requires-python = ">=3.11"
authors = [
  { name = "Goh Kun Ming" }
]
dependencies = [
  "cairosvg>=2.7,<3",
  "pillow>=10,<13",
  "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"tests/**/*.py" = ["D"]
