approach:
  - title: Start with the decision
    desc: Engage stakeholders to agree on users, decisions, success criteria, and constraints before choosing an algorithm.
  - title: Treat data quality as part of the model
    desc: Make provenance, missingness, leakage, definitions, and validation explicit.
  - title: Build a baseline first
    desc: Require evidence before adding architectural complexity.
  - title: Connect the whole path
    desc: Consider how ingestion, modelling, retrieval, APIs, interfaces, roles, and deployment interact.
  - title: Design for failure
    desc: Address robustness, uncertainty, access control, fallbacks, and limitations.
  - title: Leave an inspectable trail
    desc: Preserve tests, documentation, evaluation artifacts, and handover notes.

