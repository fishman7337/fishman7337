<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spatial Portfolio visual gallery</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100% - 36px, 980px); margin: 24px auto 80px; }
      img { display: block; width: 100%; height: auto; margin: 0 0 24px; }
      h1 { margin: 0 0 8px; }
      p { color: #9da7b3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spatial Portfolio visual gallery</h1>
      <p>Browser preview of the complete cinematic 3D, animated mesh, and responsive SVG system.</p>
      <img src="../assets/spatial-hero.svg" alt="Spatial Portfolio identity hero" />
      <img src="../assets/spatial-hero-mobile.svg" alt="Mobile identity hero" style="max-width: 420px" />
      <img src="../assets/world-generative-vision.svg" alt="Generative Vision world" />
      <img src="../assets/world-language-memory.svg" alt="Language and Memory world" />
      <img src="../assets/world-movement-products.svg" alt="Movement and Products world" />
      <img src="../assets/curiosity-knot-wireframe.svg" alt="Animated Curiosity Knot wireframe" />
      <img src="../assets/tool-constellation.svg" alt="Tool constellation" />
      <img src="../assets/spatial-footer.svg" alt="Spatial closing portal" />
      <img src="../assets/spatial-footer-mobile.svg" alt="Mobile closing portal" style="max-width: 420px" />
    </main>
  </body>
</html>
