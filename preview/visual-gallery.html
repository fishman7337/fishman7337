<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curiosity Workshop visual gallery</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100% - 36px, 980px); margin: 24px auto 80px; }
      img { display: block; width: 100%; height: auto; margin: 0 0 24px; }
      h1 { margin: 0 0 8px; }
      p { color: #9da7b3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Curiosity Workshop visual gallery</h1>
      <p>Browser preview of the complete tactile 3D and animated SVG system.</p>
      <img src="../assets/hero-curiosity-workshop.svg" alt="Curiosity Workshop identity hero" />
      <img src="../assets/hero-curiosity-workshop-mobile.svg" alt="Mobile identity hero" style="max-width: 420px" />
      <img src="../assets/project-cabinet.svg" alt="Six-drawer project cabinet" />
      <img src="../assets/making-machine.svg" alt="Animated making machine" />
      <img src="../assets/workshop-footer.svg" alt="Workshop closing note" />
      <img src="../assets/workshop-footer-mobile.svg" alt="Mobile closing note" style="max-width: 420px" />
    </main>
  </body>
</html>
