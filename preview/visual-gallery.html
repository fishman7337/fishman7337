<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Garden visual gallery</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100% - 36px, 980px); margin: 24px auto 80px; }
      img { display: block; width: 100%; height: auto; margin: 0 0 24px; }
      .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .projects img { margin: 0; }
      h1 { margin: 0 0 8px; }
      p { color: #9da7b3; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Signal Garden visual gallery</h1>
      <p>Browser preview of the complete editorial Signal Garden system.</p>
      <img src="../assets/hero-signal-garden.svg" alt="Integrated Signal Garden identity hero" />
      <img src="../assets/studio-manifesto.svg" alt="Studio manifesto" />
      <div class="projects">
        <img src="../assets/project-01-hybrid-quantum-classical-gan-research.svg" alt="HQCGAN specimen" />
        <img src="../assets/project-02-leaf-object-detection.svg" alt="Leaf detection specimen" />
        <img src="../assets/project-03-sp-daaa-dsaa-ca1-haiku-generator.svg" alt="HaikuForge specimen" />
        <img src="../assets/project-04-sp-daaa-dsaa-ca2-newspaper-restoration.svg" alt="Newspaper restoration specimen" />
        <img src="../assets/project-05-sp-daaa-pai-ca2-gobest-trip-safety-predictor.svg" alt="GoBest specimen" />
        <img src="../assets/project-06-sp-daaa-bed-ca-fitnessquest.svg" alt="FitnessQuest specimen" />
      </div>
      <img src="../assets/research-observatory.svg" alt="HQCGAN research centerpiece" />
      <img src="../assets/craft-map.svg" alt="Craft map" />
      <img src="../assets/signal-footer.svg" alt="Closing Signal Garden wave" />
    </main>
  </body>
</html>
