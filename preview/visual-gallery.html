<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Garden visual gallery</title>
    <style>
      * { box-sizing: border-box; }

  </head>
  <body>
    <main>
      <h1>Signal Garden visual gallery</h1>
      <p>Browser preview of the integrated 3D identity hero and four supporting animated SVGs.</p>
      <img src="../assets/hero-signal-garden.svg" alt="Integrated Signal Garden identity hero" />
      <img src="../assets/focus-garden.svg" alt="Four focus cards" />
      <img src="../assets/project-garden.svg" alt="Project constellation" />
      <img src="../assets/research-loop.svg" alt="Evidence-first research loop" />
      <img src="../assets/signal-footer.svg" alt="Closing Signal Garden wave" />

</html>
